<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator — ABAGJA ORBIT</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .calc-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.5rem;
      align-items: start;
    }
    @media (max-width: 800px) {
      .calc-layout { grid-template-columns: 1fr; }
    }

    /* ── CALCULATOR ── */
    .calc-body {
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: sticky;
      top: 76px;
    }

    .calc-screen {
      padding: 1.5rem 1.5rem 1rem;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .calc-expr {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--text3);
      text-align: right;
      min-height: 1.4em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .calc-display {
      font-family: 'DM Mono', monospace;
      font-size: 2.6rem;
      font-weight: 300;
      color: var(--text);
      text-align: right;
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.15s;
    }
    .calc-display.result-shown { color: var(--gold); }

    .calc-keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
    }

    .key {
      border: none;
      padding: 0;
      height: 64px;
      font-family: 'Sora', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      background: var(--bg1);
      color: var(--text);
      transition: all 0.12s var(--ease);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.01em;
    }

    .key::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.12s;
    }

    .key:active::after { background: rgba(255,255,255,0.06); }

    .key:hover { background: var(--bg3); }

    .key.fn    { background: var(--bg2); color: var(--text2); font-size: 0.85rem; }
    .key.op    { background: var(--bg2); color: var(--gold2); font-size: 1.1rem; }
    .key.eq    { background: var(--gold); color: var(--bg0); font-size: 1.2rem; grid-row: span 2; }
    .key.eq:hover { background: #f0c45a; }
    .key.zero  { grid-column: span 2; justify-content: flex-start; padding-left: 26px; }
    .key.neg   { font-size: 0.85rem; }

    .key.fn:hover { color: var(--gold); }
    .key.op:hover { color: var(--gold); }

    /* ── HISTORY ── */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .history-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text3);
      font-size: 0.82rem;
    }

    .hist-item {
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      margin-bottom: 0.6rem;
      transition: all 0.2s var(--ease);
      animation: fadeUp 0.22s var(--ease) both;
    }
    .hist-item:hover {
      border-color: var(--border2);
      transform: translateY(-1px);
    }

    .hist-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .hist-expr {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--text3);
      flex: 1;
      word-break: break-all;
    }

    .hist-result {
      font-family: 'DM Mono', monospace;
      font-size: 1.05rem;
      color: var(--gold);
      font-weight: 500;
      text-align: right;
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .hist-result:hover { color: #f0c45a; }

    .hist-note-wrap {
      margin-top: 6px;
    }

    .hist-note-display {
      font-size: 0.78rem;
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      transition: color 0.15s;
    }
    .hist-note-display:hover { color: var(--gold); }
    .hist-note-display .note-icon { color: var(--text3); font-size: 0.7rem; }
    .hist-note-display.empty { color: var(--text3); font-style: italic; }

    .hist-note-input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-size: 0.8rem;
      padding: 7px 10px;
      outline: none;
      margin-top: 4px;
      transition: border-color 0.2s;
    }
    .hist-note-input:focus { border-color: var(--gold); }

    .hist-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      align-items: center;
    }

    .hist-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 100px;
      transition: all 0.15s;
      font-family: 'Sora', sans-serif;
      color: var(--text3);
    }
    .hist-btn:hover { color: var(--gold); background: var(--gold-dim); }
    .hist-btn.del:hover { color: var(--red); background: rgba(217,83,74,0.1); }

    .hist-time {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      color: var(--text3);
      margin-left: auto;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a class="nav-logo" href="index.html">ABAGJA <span>ORBIT</span></a>
    <ul class="nav-links">
      <li><a href="index.html"><span class="nav-icon">⌂</span> Home</a></li>
      <li><a href="clock.html"><span class="nav-icon">◷</span> Time</a></li>
      <li><a href="currency.html"><span class="nav-icon">◈</span> Currency</a></li>
      <li><a href="calculator.html" class="active"><span class="nav-icon">⊞</span> Calculator</a></li>
    </ul>
  </nav>

  <div class="page">
    <div class="container">
      <div class="page-header anim-up">
        <div class="eyebrow">Module 03</div>
        <h1>Calculator</h1>
        <p>Smart calculator with annotatable history</p>
      </div>

      <div class="calc-layout">
        <!-- ═══ CALCULATOR ═══ -->
        <div class="calc-body anim-up">
          <div class="calc-screen">
            <div class="calc-expr" id="calc-expr"></div>
            <div class="calc-display" id="calc-display">0</div>
          </div>
          <div class="calc-keypad">
            <!-- Row 1 -->
            <button class="key fn" data-action="clear">AC</button>
            <button class="key fn" data-action="sign">+/−</button>
            <button class="key fn" data-action="percent">%</button>
            <button class="key op" data-action="op" data-val="÷">÷</button>
            <!-- Row 2 -->
            <button class="key" data-action="num" data-val="7">7</button>
            <button class="key" data-action="num" data-val="8">8</button>
            <button class="key" data-action="num" data-val="9">9</button>
            <button class="key op" data-action="op" data-val="×">×</button>
            <!-- Row 3 -->
            <button class="key" data-action="num" data-val="4">4</button>
            <button class="key" data-action="num" data-val="5">5</button>
            <button class="key" data-action="num" data-val="6">6</button>
            <button class="key op" data-action="op" data-val="−">−</button>
            <!-- Row 4 -->
            <button class="key" data-action="num" data-val="1">1</button>
            <button class="key" data-action="num" data-val="2">2</button>
            <button class="key" data-action="num" data-val="3">3</button>
            <button class="key op" data-action="op" data-val="+">+</button>
            <!-- Row 5 -->
            <button class="key zero" data-action="num" data-val="0">0</button>
            <button class="key" data-action="decimal">.</button>
            <button class="key eq" data-action="equals">=</button>
          </div>
        </div>

        <!-- ═══ HISTORY ═══ -->
        <div class="anim-up">
          <div class="history-header">
            <div class="card-title" style="margin:0">History</div>
            <button class="btn btn-ghost" id="clear-history" style="padding:5px 14px;font-size:0.72rem">Clear All</button>
          </div>
          <div id="history-list">
            <div class="history-empty">
              <div style="font-size:1.5rem;margin-bottom:8px;opacity:0.4">🧮</div>
              Calculations will appear here.<br>
              <span style="font-size:0.72rem;opacity:0.6">Click a result to reuse it.</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // ── STATE ──────────────────────────────────────────
    let displayVal = '0';
    let expression = '';
    let operand1 = null;
    let currentOp = null;
    let waitingForOperand = false;
    let justEqualed = false;
    let history = JSON.parse(localStorage.getItem('orbit-calc-history') || '[]');

    const display = document.getElementById('calc-display');
    const exprEl  = document.getElementById('calc-expr');

    function saveHistory() {
      localStorage.setItem('orbit-calc-history', JSON.stringify(history));
    }

    function setDisplay(val) {
      displayVal = String(val);
      const n = parseFloat(displayVal);
      display.textContent = isNaN(n) ? displayVal : n.toLocaleString('fullwide', { maximumFractionDigits: 10 });
    }

    // ── BUTTONS ───────────────────────────────────────
    document.querySelectorAll('.key').forEach(key => {
      key.addEventListener('click', () => handleAction(key));
    });

    function handleAction(key) {
      const action = key.dataset.action;
      const val    = key.dataset.val;

      switch (action) {
        case 'num':     inputNum(val);    break;
        case 'op':      inputOp(val);     break;
        case 'equals':  doEquals();       break;
        case 'clear':   doClear();        break;
        case 'sign':    doSign();         break;
        case 'percent': doPercent();      break;
        case 'decimal': inputDecimal();   break;
      }
    }

    // ── KEYBOARD ─────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') inputNum(e.key);
      else if (e.key === '.') inputDecimal();
      else if (e.key === '+') inputOp('+');
      else if (e.key === '-') inputOp('−');
      else if (e.key === '*') inputOp('×');
      else if (e.key === '/') { e.preventDefault(); inputOp('÷'); }
      else if (e.key === 'Enter' || e.key === '=') doEquals();
      else if (e.key === 'Escape') doClear();
      else if (e.key === 'Backspace') doBackspace();
      else if (e.key === '%') doPercent();
    });

    function inputNum(n) {
      display.classList.remove('result-shown');
      if (waitingForOperand || justEqualed) {
        if (justEqualed) { expression = ''; justEqualed = false; }
        setDisplay(n);
        waitingForOperand = false;
      } else {
        setDisplay(displayVal === '0' ? n : displayVal + n);
      }
    }

    function inputDecimal() {
      display.classList.remove('result-shown');
      if (waitingForOperand) { setDisplay('0.'); waitingForOperand = false; return; }
      if (!displayVal.includes('.')) setDisplay(displayVal + '.');
    }

    function inputOp(op) {
      display.classList.remove('result-shown');
      const current = parseFloat(displayVal);
      if (operand1 !== null && !waitingForOperand) {
        const result = compute(operand1, current, currentOp);
        setDisplay(result);
        operand1 = result;
      } else {
        operand1 = current;
      }
      expression = displayVal + ' ' + op;
      exprEl.textContent = expression;
      currentOp = op;
      waitingForOperand = true;
      justEqualed = false;
    }

    function doEquals() {
      if (currentOp === null || waitingForOperand) return;
      const current = parseFloat(displayVal);
      const result = compute(operand1, current, currentOp);
      const fullExpr = `${formatNum(operand1)} ${currentOp} ${formatNum(current)} =`;
      exprEl.textContent = fullExpr;
      setDisplay(result);
      display.classList.add('result-shown');

      // Push to history
      const entry = {
        id: Date.now(),
        expr: fullExpr,
        result: result,
        note: '',
        time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
      };
      history.unshift(entry);
      saveHistory();
      renderHistory();

      operand1 = null;
      currentOp = null;
      waitingForOperand = false;
      justEqualed = true;
    }

    function doClear() {
      displayVal = '0';
      expression = '';
      operand1 = null;
      currentOp = null;
      waitingForOperand = false;
      justEqualed = false;
      display.textContent = '0';
      display.classList.remove('result-shown');
      exprEl.textContent = '';
    }

    function doSign() {
      setDisplay(parseFloat(displayVal) * -1);
    }

    function doPercent() {
      setDisplay(parseFloat(displayVal) / 100);
    }

    function doBackspace() {
      if (displayVal.length > 1) setDisplay(displayVal.slice(0, -1));
      else setDisplay('0');
    }

    function compute(a, b, op) {
      switch (op) {
        case '+': return round(a + b);
        case '−': return round(a - b);
        case '×': return round(a * b);
        case '÷': return b !== 0 ? round(a / b) : 'Error';
      }
    }

    function round(n) {
      return Math.round(n * 1e10) / 1e10;
    }

    function formatNum(n) {
      return Number.isInteger(n) ? n.toString() : parseFloat(n.toFixed(6)).toString();
    }

    // ── HISTORY RENDER ────────────────────────────────
    function renderHistory() {
      const list = document.getElementById('history-list');
      if (!history.length) {
        list.innerHTML = `<div class="history-empty">
          <div style="font-size:1.5rem;margin-bottom:8px;opacity:0.4">🧮</div>
          Calculations will appear here.<br>
          <span style="font-size:0.72rem;opacity:0.6">Click a result to reuse it.</span>
        </div>`;
        return;
      }

      list.innerHTML = history.map((h, i) => `
        <div class="hist-item" id="hist-${h.id}">
          <div class="hist-top">
            <div class="hist-expr">${h.expr}</div>
            <div class="hist-result" title="Click to reuse" onclick="reuseResult(${h.result})">${formatNum(h.result)}</div>
          </div>
          <div class="hist-note-wrap">
            <div class="hist-note-display ${h.note ? '' : 'empty'}" id="note-display-${h.id}" onclick="editNote(${h.id})">
              <span class="note-icon">${h.note ? '📝' : '+'}</span>
              <span>${h.note || 'Add note...'}</span>
            </div>
            <input type="text" class="hist-note-input" id="note-input-${h.id}"
              style="display:none" placeholder="Type a note and press Enter..."
              value="${h.note}"
              onkeydown="saveNote(event, ${h.id})"
              onblur="saveNote({key:'Enter'}, ${h.id})">
          </div>
          <div class="hist-actions">
            <button class="hist-btn del" onclick="deleteHistory(${h.id})">✕ Delete</button>
            <span class="hist-time">${h.time}</span>
          </div>
        </div>
      `).join('');
    }

    function reuseResult(val) {
      setDisplay(val);
      display.classList.add('result-shown');
      operand1 = val;
      waitingForOperand = true;
      justEqualed = false;
    }

    function editNote(id) {
      const display_ = document.getElementById('note-display-' + id);
      const input = document.getElementById('note-input-' + id);
      display_.style.display = 'none';
      input.style.display = 'block';
      input.focus();
      input.select();
    }

    function saveNote(e, id) {
      if (e.key !== 'Enter' && e.type !== 'blur') return;
      const input = document.getElementById('note-input-' + id);
      const val = input.value.trim();
      const idx = history.findIndex(h => h.id === id);
      if (idx !== -1) {
        history[idx].note = val;
        saveHistory();
        renderHistory();
      }
    }

    function deleteHistory(id) {
      history = history.filter(h => h.id !== id);
      saveHistory();
      const item = document.getElementById('hist-' + id);
      if (item) {
        item.style.opacity = '0';
        item.style.transform = 'translateX(20px)';
        item.style.transition = 'all 0.2s';
        setTimeout(renderHistory, 200);
      }
    }

    document.getElementById('clear-history').addEventListener('click', () => {
      if (!history.length) return;
      history = [];
      saveHistory();
      renderHistory();
    });

    // ── INIT ──────────────────────────────────────────
    renderHistory();
  </script>
</body>
</html>
