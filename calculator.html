<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator — Abagja Orbit</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&family=Cormorant+Garamond:wght@300;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg0:#0a0908;--bg1:#13110f;--bg2:#1c1814;--bg3:#252018;--border:rgba(232,184,75,0.12);--border2:rgba(232,184,75,0.26);--gold:#e8b84b;--gold2:#c4873a;--gold-dim:rgba(232,184,75,0.10);--text:#f0ead8;--text2:#a8997a;--text3:#6a5e48;--red:#d9534a;--green:#7dba84;--radius:14px;--radius-lg:20px;--ease:cubic-bezier(0.4,0,0.2,1);--spring:cubic-bezier(0.34,1.56,0.64,1)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Sora',sans-serif;background:var(--bg0);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
    body::before{content:'';position:fixed;inset:0;opacity:.028;pointer-events:none;z-index:9999;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    .topbar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:52px;background:rgba(10,9,8,.88);backdrop-filter:blur(24px);border-bottom:1px solid rgba(232,184,75,0.08)}
    .back-btn{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;letter-spacing:.14em;opacity:.75;transition:all .2s}
    .back-btn:hover{opacity:1}
    .back-btn .arr{color:var(--text3);transition:transform .2s}
    .back-btn:hover .arr{transform:translateX(-3px)}
    .page-badge{font-family:'DM Mono',monospace;font-size:.56rem;color:var(--text3);letter-spacing:.22em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
    .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);transition:background .3s;flex-shrink:0}
    .sync-dot.ok{background:var(--green);animation:sdot 2.5s ease infinite}
    .sync-dot.syncing{background:var(--gold);animation:sdot .5s ease infinite}
    .sync-dot.err{background:var(--red);animation:none}
    @keyframes sdot{0%,100%{opacity:1}50%{opacity:.25}}
    .page{padding-top:52px}
    .container{max-width:1100px;margin:0 auto;padding:2.5rem 2rem 5rem}
    .page-header{margin-bottom:2rem}
    .page-header h1{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:600;letter-spacing:-.01em}
    .page-header p{margin-top:4px;font-size:.82rem;color:var(--text3);font-weight:300}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .au{animation:fadeUp .44s var(--ease) both}
    .d1{animation-delay:.07s}
    .layout{display:grid;grid-template-columns:320px 1fr;gap:1.5rem;align-items:start}
    @media(max-width:780px){.layout{grid-template-columns:1fr}}
    .calc-wrap{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;position:sticky;top:68px}
    .calc-screen{padding:1.4rem 1.4rem 1rem;background:var(--bg2);border-bottom:1px solid var(--border);min-height:110px;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
    .calc-expr{font-family:'DM Mono',monospace;font-size:.76rem;color:var(--text3);text-align:right;min-height:1.3em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .calc-disp{font-family:'DM Mono',monospace;font-size:2.5rem;font-weight:300;color:var(--text);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s;user-select:text}
    .calc-disp.hasil{color:var(--gold)}
    .paste-hint{position:absolute;top:8px;right:12px;font-family:'DM Mono',monospace;font-size:.56rem;color:var(--text3);opacity:0;transition:opacity .2s;pointer-events:none}
    .calc-screen:hover .paste-hint{opacity:1}
    .keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border)}
    .key{border:none;height:62px;font-family:'Sora',sans-serif;font-size:1rem;font-weight:500;cursor:pointer;background:var(--bg1);color:var(--text);transition:background .12s;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-tap-highlight-color:transparent}
    .key:hover{background:var(--bg2)}.key:active{background:var(--bg3)}
    .key.fn{background:var(--bg2);color:var(--text2);font-size:.83rem}.key.fn:hover{background:var(--bg3);color:var(--gold)}
    .key.op{background:var(--bg2);color:var(--gold2);font-size:1.1rem}.key.op:hover{background:var(--bg3);color:var(--gold)}
    .key.eq{background:var(--gold);color:var(--bg0);font-size:1.2rem;grid-row:span 2}.key.eq:hover{background:#f0c45a}
    .key.zero{grid-column:span 2;justify-content:flex-start;padding-left:24px}
    .hist-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
    .card-title{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--text3)}
    .btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;border-radius:100px;font-family:'Sora',sans-serif;font-size:.75rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);transition:all .2s var(--ease)}
    .btn:hover{color:var(--gold);border-color:var(--border2);background:var(--gold-dim)}
    .hist-empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:.8rem}
    .hist-empty .ei{font-size:1.5rem;margin-bottom:8px;opacity:.35}
    .hitem{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;margin-bottom:.6rem;transition:all .2s var(--ease);animation:fadeUp .2s var(--ease) both}
    .hitem:hover{border-color:var(--border2);transform:translateY(-1px)}
    .hitem-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:3px}
    .hitem-expr{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text3);flex:1;word-break:break-all}
    .hitem-res{font-family:'DM Mono',monospace;font-size:1.05rem;color:var(--gold);font-weight:500;cursor:pointer;flex-shrink:0;transition:color .15s}
    .hitem-res:hover{color:#f0c45a}
    .hitem-note-disp{font-size:.76rem;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:6px;padding:3px 0;transition:color .15s;margin-top:4px}
    .hitem-note-disp:hover{color:var(--gold)}
    .hitem-note-disp.empty{color:var(--text3);font-style:italic}
    .note-icon{font-size:.68rem;color:var(--text3)}
    .hitem-note-inp{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Sora',sans-serif;font-size:.78rem;padding:7px 10px;outline:none;margin-top:4px;transition:border-color .2s}
    .hitem-note-inp:focus{border-color:var(--gold)}
    .hitem-actions{display:flex;gap:6px;margin-top:6px;align-items:center}
    .hbtn{background:none;border:none;cursor:pointer;font-size:.68rem;padding:3px 8px;border-radius:100px;transition:all .15s;font-family:'Sora',sans-serif;color:var(--text3)}
    .hbtn:hover{color:var(--gold);background:var(--gold-dim)}
    .hbtn.del:hover{color:var(--red);background:rgba(217,83,74,.1)}
    .htime{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--text3);margin-left:auto}
    .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);border:1px solid var(--border2);border-radius:100px;padding:10px 22px;font-size:.78rem;color:var(--gold);font-family:'DM Mono',monospace;opacity:0;transition:all .32s var(--spring);pointer-events:none;z-index:999;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg0)}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:99px}
  
    /* ─── CUSTOM CURSOR (desktop only) ─────────────── */
    @media (min-width: 769px) {
      *, *::before, *::after { cursor: none !important; }
      #c-dot {
        position: fixed;
        width: 6px; height: 6px;
        background: #e8b84b;
        border-radius: 50%;
        pointer-events: none;
        z-index: 99999;
        transform: translate(-50%, -50%);
        transition: width 0.2s, height 0.2s;
        opacity: 0;
      }
      #c-ring {
        position: fixed;
        width: 36px; height: 36px;
        border: 1.5px solid rgba(232,184,75,0.55);
        border-radius: 50%;
        pointer-events: none;
        z-index: 99998;
        transform: translate(-50%, -50%);
        transition: width 0.25s, height 0.25s, border-color 0.25s;
        opacity: 0;
      }
      #c-dot.hovering { width: 10px; height: 10px; }
      #c-ring.hovering { width: 52px; height: 52px; border-color: rgba(232,184,75,0.85); }
    }
    /* ─── RIPPLE TAP (mobile only) ──────────────────── */
    @media (max-width: 768px) {
      .ripple-tap {
        position: fixed;
        border-radius: 50%;
        border: 1.5px solid rgba(232,184,75,0.7);
        pointer-events: none;
        z-index: 99999;
        width: 0; height: 0;
        transform: translate(-50%, -50%);
        animation: ripple-out 0.7s ease-out forwards;
      }
      @keyframes ripple-out {
        0%   { width: 0; height: 0; opacity: 0.9; }
        100% { width: 80px; height: 80px; opacity: 0; }
      }
    }
  </style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="index.html"><span class="arr">←</span> Abagja Orbit</a>
  <span class="page-badge"><span class="sync-dot" id="sync-dot"></span>Kalkulator</span>
</div>
<div class="toast" id="toast"></div>

<div class="page">
  <div class="container">
    <div class="page-header au">
      <h1>Kalkulator</h1>
      <p>Riwayat tersinkron di semua device. Bisa paste angka juga.</p>
    </div>
    <div class="layout">
      <div class="calc-wrap au">
        <div class="calc-screen">
          <div class="paste-hint">Ctrl+V untuk paste angka</div>
          <div class="calc-expr" id="c-expr"></div>
          <div class="calc-disp" id="c-disp">0</div>
        </div>
        <div class="keypad">
          <button class="key fn" data-a="clear">AC</button>
          <button class="key fn" data-a="sign">+/−</button>
          <button class="key fn" data-a="pct">%</button>
          <button class="key op" data-a="op" data-v="÷">÷</button>
          <button class="key" data-a="num" data-v="7">7</button>
          <button class="key" data-a="num" data-v="8">8</button>
          <button class="key" data-a="num" data-v="9">9</button>
          <button class="key op" data-a="op" data-v="×">×</button>
          <button class="key" data-a="num" data-v="4">4</button>
          <button class="key" data-a="num" data-v="5">5</button>
          <button class="key" data-a="num" data-v="6">6</button>
          <button class="key op" data-a="op" data-v="−">−</button>
          <button class="key" data-a="num" data-v="1">1</button>
          <button class="key" data-a="num" data-v="2">2</button>
          <button class="key" data-a="num" data-v="3">3</button>
          <button class="key op" data-a="op" data-v="+">+</button>
          <button class="key zero" data-a="num" data-v="0">0</button>
          <button class="key" data-a="dec">.</button>
          <button class="key eq" data-a="eq">=</button>
        </div>
      </div>
      <div class="au d1">
        <div class="hist-header">
          <div class="card-title">Riwayat Kalkulasi</div>
          <button class="btn" id="clear-hist">Hapus Semua</button>
        </div>
        <div id="hist-list">
          <div class="hist-empty"><div class="ei">⏳</div>Menghubungkan ke cloud...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot, query, orderBy, writeBatch, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const app = initializeApp({
    apiKey: "AIzaSyCJlPlTfMXYwPuykQhsx-duxM_LfTU68gA",
    authDomain: "abagja-orbit.firebaseapp.com",
    projectId: "abagja-orbit",
    storageBucket: "abagja-orbit.firebasestorage.app",
    messagingSenderId: "554354531256",
    appId: "1:554354531256:web:19d90218bd6dbcb9ed8d4d"
  });
  const db = getFirestore(app);
  const col = collection(db, 'calc_history');

  // ── HELPERS ──
  const syncDot = document.getElementById('sync-dot');
  function setSyncing(s){ syncDot.className = 'sync-dot ' + s; }

  let toastTO;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTO); toastTO = setTimeout(()=>t.classList.remove('show'), 3000);
  }

  // ── CALC STATE ──
  let disp='0', expr='', op1=null, curOp=null, waitOp=false, equaled=false;
  const dispEl = document.getElementById('c-disp');
  const exprEl = document.getElementById('c-expr');

  function fmtN(n){ return Number.isInteger(n)?n.toString():parseFloat(n.toFixed(8)).toString(); }
  function setDisp(v){
    disp = String(v);
    const n = parseFloat(disp);
    dispEl.textContent = isNaN(n) ? disp : n.toLocaleString('id-ID',{maximumFractionDigits:10});
  }
  function compute(a,b,op){
    const R=n=>Math.round(n*1e10)/1e10;
    if(op==='+')return R(a+b); if(op==='−')return R(a-b);
    if(op==='×')return R(a*b); if(op==='÷')return b!==0?R(a/b):'Error';
  }

  // ── KEYPAD ──
  document.querySelectorAll('.key').forEach(k=>{
    k.addEventListener('click',()=>{
      const a=k.dataset.a, v=k.dataset.v;
      if(a==='num') inputNum(v);
      else if(a==='op') inputOp(v);
      else if(a==='eq') doEq();
      else if(a==='clear') doClear();
      else if(a==='sign') doSign();
      else if(a==='pct') doPct();
      else if(a==='dec') inputDec();
    });
  });

  // ── KEYBOARD ──
  document.addEventListener('keydown', e=>{
    if(e.target.classList.contains('hitem-note-inp')) return;
    if(e.key>='0'&&e.key<='9') inputNum(e.key);
    else if(e.key==='.') inputDec();
    else if(e.key==='+') inputOp('+');
    else if(e.key==='-') inputOp('−');
    else if(e.key==='*') inputOp('×');
    else if(e.key==='/'){e.preventDefault();inputOp('÷');}
    else if(e.key==='Enter'||e.key==='=') doEq();
    else if(e.key==='Escape') doClear();
    else if(e.key==='Backspace') doBk();
    else if(e.key==='%') doPct();
  });

  // ── PASTE ──
  document.addEventListener('paste', e=>{
    if(e.target.classList.contains('hitem-note-inp')) return;
    e.preventDefault();
    const raw = (e.clipboardData||window.clipboardData).getData('text');
    const cleaned = raw.replace(/,/g,'.').replace(/[^\d.\-]/g,'').trim();
    const n = parseFloat(cleaned);
    if(!isNaN(n)&&cleaned!==''){
      dispEl.classList.remove('hasil');
      setDisp(n); waitOp=false; equaled=false;
      showToast('📋 Di-paste: '+n.toLocaleString('id-ID'));
    } else {
      showToast('⚠ Bukan angka yang valid');
    }
  });

  function inputNum(n){
    dispEl.classList.remove('hasil');
    if(waitOp||equaled){if(equaled){expr='';equaled=false;}setDisp(n);waitOp=false;}
    else{setDisp(disp==='0'?n:disp+n);}
  }
  function inputDec(){
    dispEl.classList.remove('hasil');
    if(waitOp){setDisp('0.');waitOp=false;return;}
    if(!disp.includes('.')) setDisp(disp+'.');
  }
  function inputOp(op){
    dispEl.classList.remove('hasil');
    const cur=parseFloat(disp);
    if(op1!==null&&!waitOp){const r=compute(op1,cur,curOp);setDisp(r);op1=r;}
    else{op1=cur;}
    expr=disp+' '+op; exprEl.textContent=expr;
    curOp=op; waitOp=true; equaled=false;
  }
  async function doEq(){
    if(curOp===null||waitOp) return;
    const cur=parseFloat(disp);
    const r=compute(op1,cur,curOp);
    const fullExpr=fmtN(op1)+' '+curOp+' '+fmtN(cur)+' =';
    exprEl.textContent=fullExpr;
    setDisp(r); dispEl.classList.add('hasil');
    op1=null; curOp=null; waitOp=false; equaled=true;
    setSyncing('syncing');
    try{
      await addDoc(col,{
        expr:fullExpr, result:r, note:'',
        time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),
        createdAt:Date.now()
      });
      setSyncing('ok');
    }catch(e){setSyncing('err');showToast('⚠ Gagal simpan ke cloud');}
  }
  function doClear(){disp='0';expr='';op1=null;curOp=null;waitOp=false;equaled=false;dispEl.textContent='0';dispEl.classList.remove('hasil');exprEl.textContent='';}
  function doSign(){setDisp(parseFloat(disp)*-1);}
  function doPct(){setDisp(parseFloat(disp)/100);}
  function doBk(){if(disp.length>1)setDisp(disp.slice(0,-1));else setDisp('0');}

  // ── GLOBAL FUNCTIONS (dipanggil dari HTML) ──
  window.reuseResult = val=>{
    setDisp(val); dispEl.classList.add('hasil'); op1=val; waitOp=true; equaled=false;
  };
  window.editNote = id=>{
    document.getElementById('nd-'+id).style.display='none';
    const inp=document.getElementById('ni-'+id);
    inp.style.display='block'; inp.focus(); inp.select();
  };
  window.saveNote = async(e,id)=>{
    if(e.key!=='Enter'&&e.type!=='blur') return;
    const val=document.getElementById('ni-'+id).value.trim();
    setSyncing('syncing');
    try{ await updateDoc(doc(db,'calc_history',id),{note:val}); setSyncing('ok'); }
    catch(err){ setSyncing('err'); }
  };
  window.deleteHist = async id=>{
    const el=document.getElementById('hi-'+id);
    if(el){el.style.opacity='0';el.style.transform='translateX(20px)';el.style.transition='all .2s';}
    setSyncing('syncing');
    try{ await deleteDoc(doc(db,'calc_history',id)); setSyncing('ok'); }
    catch(err){ setSyncing('err'); }
  };

  document.getElementById('clear-hist').addEventListener('click', async()=>{
    setSyncing('syncing');
    try{
      const snap=await getDocs(col);
      const batch=writeBatch(db);
      snap.forEach(d=>batch.delete(d.ref));
      await batch.commit();
      setSyncing('ok');
    }catch(err){setSyncing('err');showToast('⚠ Gagal hapus semua');}
  });

  // ── RENDER ──
  function renderHist(docs){
    const list=document.getElementById('hist-list');
    if(!docs.length){
      list.innerHTML='<div class="hist-empty"><div class="ei">🧮</div>Hasil kalkulasi muncul di sini.<br><span style="font-size:.7rem;opacity:.5">Klik hasil untuk dipakai ulang.</span></div>';
      return;
    }
    list.innerHTML=docs.map(({id,data})=>
      `<div class="hitem" id="hi-${id}">
        <div class="hitem-top">
          <div class="hitem-expr">${data.expr}</div>
          <div class="hitem-res" onclick="reuseResult(${data.result})">${fmtN(data.result)}</div>
        </div>
        <div id="nd-${id}" class="hitem-note-disp ${data.note?'':'empty'}" onclick="editNote('${id}')">
          <span class="note-icon">${data.note?'📝':'+'}</span>
          <span>${data.note||'Tambah catatan...'}</span>
        </div>
        <input type="text" id="ni-${id}" class="hitem-note-inp" style="display:none"
          placeholder="Ketik catatan, tekan Enter..." value="${data.note}"
          onkeydown="saveNote(event,'${id}')" onblur="saveNote({key:'Enter'},'${id}')">
        <div class="hitem-actions">
          <button class="hbtn del" onclick="deleteHist('${id}')">✕ Hapus</button>
          <span class="htime">${data.time}</span>
        </div>
      </div>`
    ).join('');
  }

  // ── REALTIME LISTENER ──
  setSyncing('syncing');
  onSnapshot(
    query(col, orderBy('createdAt','desc')),
    snap=>{
      setSyncing('ok');
      renderHist(snap.docs.map(d=>({id:d.id,data:d.data()})));
    },
    err=>{ setSyncing('err'); showToast('⚠ Koneksi Firebase terputus'); }
  );
</script>
<div id="c-dot"></div>
<div id="c-ring"></div>
<script>
(function(){
  var dot=document.getElementById("c-dot");
  var ring=document.getElementById("c-ring");
  var isMobile=function(){return window.matchMedia("(max-width: 768px)").matches;};
  var mx=-999,my=-999,rx=-999,ry=-999,raf=null;
  function lerp(a,b,t){return a+(b-a)*t;}
  function loop(){
    rx=lerp(rx,mx,0.12); ry=lerp(ry,my,0.12);
    ring.style.left=rx+"px"; ring.style.top=ry+"px";
    raf=requestAnimationFrame(loop);
  }
  document.addEventListener("mousemove",function(e){
    if(isMobile())return;
    mx=e.clientX; my=e.clientY;
    dot.style.left=mx+"px"; dot.style.top=my+"px";
    dot.style.opacity="1"; ring.style.opacity="1";
    if(!raf)loop();
  });
  document.addEventListener("mouseleave",function(){
    dot.style.opacity="0"; ring.style.opacity="0";
  });
  document.addEventListener("mouseover",function(e){
    if(isMobile())return;
    var t=e.target.closest("a,button,.btn,.tab-btn");
    dot.classList.toggle("hovering",!!t);
    ring.classList.toggle("hovering",!!t);
  });
  document.addEventListener("touchstart",function(e){
    Array.from(e.changedTouches).forEach(function(touch){
      var r=document.createElement("div");
      r.className="ripple-tap";
      r.style.left=touch.clientX+"px";
      r.style.top=touch.clientY+"px";
      document.body.appendChild(r);
      setTimeout(function(){r.remove();},750);
    });
  },{passive:true});
})();
</script>
<style>
/* ── GLOBAL NOTIF BANNER ── */
.orbit-notif-wrap{position:fixed;top:60px;right:1.2rem;z-index:99000;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(340px,92vw)}
.orbit-notif{background:var(--bg1,#13110f);border:1px solid rgba(232,184,75,.38);border-radius:16px;padding:13px 16px 13px 14px;display:flex;align-items:flex-start;gap:11px;pointer-events:all;cursor:pointer;box-shadow:0 8px 32px rgba(0,0,0,.55),0 0 0 1px rgba(232,184,75,.08);transform:translateX(110%);opacity:0;transition:transform .38s cubic-bezier(0.34,1.56,0.64,1),opacity .3s ease;position:relative;overflow:hidden}
.orbit-notif.in{transform:translateX(0);opacity:1}
.orbit-notif.out{transform:translateX(110%);opacity:0;transition:transform .28s ease,opacity .22s ease}
.orbit-notif::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--on-color,#e8b84b),transparent)}
.orbit-notif-icon{font-size:1.5rem;flex-shrink:0;line-height:1;margin-top:1px}
.orbit-notif-body{flex:1;min-width:0}
.orbit-notif-type{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;color:var(--on-color,#e8b84b);margin-bottom:2px;opacity:.8}
.orbit-notif-title{font-family:'Sora',sans-serif;font-size:.88rem;font-weight:600;color:#f0ead8;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orbit-notif-sub{font-family:'DM Mono',monospace;font-size:.68rem;color:#6a5e48;margin-top:2px;letter-spacing:.04em}
.orbit-notif-close{flex-shrink:0;background:none;border:none;color:#6a5e48;font-size:1rem;cursor:pointer;padding:0;line-height:1;margin-top:1px;transition:color .15s}
.orbit-notif-close:hover{color:#f0ead8}
.orbit-notif-progress{position:absolute;bottom:0;left:0;height:2px;background:var(--on-color,#e8b84b);opacity:.35;transform-origin:left;animation:notif-progress linear forwards}
@keyframes notif-progress{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* alarm variant */
.orbit-notif.alarm{--on-color:#d9534a;border-color:rgba(217,83,74,.4);animation:notif-shake .5s ease}
@keyframes notif-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
/* go-to-clock pill */
.orbit-notif-go{display:inline-block;margin-top:6px;font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;color:var(--on-color,#e8b84b);background:rgba(232,184,75,.08);border:1px solid rgba(232,184,75,.18);border-radius:100px;padding:3px 10px;text-decoration:none;transition:background .15s}
.orbit-notif-go:hover{background:rgba(232,184,75,.16)}
</style>

<div class="orbit-notif-wrap" id="orbit-notif-wrap"></div>

<script>
(function(){
  // ── CONFIG ──
  var CLOCK_PAGE = 'clock.html'; // sesuaikan path jika perlu
  var ch = null;
  try{ ch = new BroadcastChannel('orbit-notif'); }catch(e){}

  // ── AUDIO (Web Audio API) ──
  var actx = null;
  function getCtx(){
    if(!actx) actx = new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    return actx;
  }
  function beep(freq,dur,vol,delay,type){
    try{
      var c=getCtx(),o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.frequency.value=freq; o.type=type||'sine';
      var t=c.currentTime+delay;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(vol,t+0.01);
      g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.start(t); o.stop(t+dur+.02);
    }catch(e){}
  }
  var ringIntervals = {};
  function startRing(id, type){
    stopRing(id);
    function once(){
      if(type==='alarm'){
        beep(1047,.12,.45,0,'square'); beep(1319,.12,.45,.13,'square');
        beep(1047,.12,.45,.26,'square'); beep(1319,.12,.45,.39,'square');
        beep(880,.4,.4,.54,'sine');
      } else {
        beep(660,.15,.28,0); beep(880,.15,.28,.18); beep(1100,.25,.28,.36);
      }
    }
    once();
    ringIntervals[id] = setInterval(once, type==='alarm'?1700:2200);
  }
  function stopRing(id){
    if(ringIntervals[id]){ clearInterval(ringIntervals[id]); delete ringIntervals[id]; }
  }

  // ── BANNER ──
  var wrap = document.getElementById('orbit-notif-wrap');
  var timers = {};
  function showBanner(data){
    // data: { id, type:'alarm'|'timer'|'stopwatch', title, sub, dur }
    // dur = ms sebelum auto-dismiss (0 = sticky)
    var id = data.id || ('n-'+Date.now());
    // Hapus duplikat
    var old = document.getElementById('onotif-'+id);
    if(old) old.remove();

    var isAlarm = data.type === 'alarm';
    var icon = isAlarm ? '&#x23F0;' : (data.type==='stopwatch' ? '&#x23F2;' : '&#x23F1;');
    var label = isAlarm ? 'ALARM' : (data.type==='stopwatch' ? 'STOPWATCH' : 'TIMER');
    var dur = data.dur || (isAlarm ? 0 : 8000);

    var el = document.createElement('div');
    el.className = 'orbit-notif' + (isAlarm ? ' alarm' : '');
    el.id = 'onotif-'+id;
    el.innerHTML =
      '<span class="orbit-notif-icon">'+icon+'</span>'+
      '<div class="orbit-notif-body">'+
        '<div class="orbit-notif-type">'+label+'</div>'+
        '<div class="orbit-notif-title">'+escHtml(data.title)+'</div>'+
        (data.sub ? '<div class="orbit-notif-sub">'+escHtml(data.sub)+'</div>' : '')+
        '<a class="orbit-notif-go" href="'+CLOCK_PAGE+'">Buka Clock &#x2192;</a>'+
      '</div>'+
      '<button class="orbit-notif-close" aria-label="Tutup">&#x2715;</button>'+
      (dur ? '<div class="orbit-notif-progress" style="animation-duration:'+dur+'ms"></div>' : '');

    wrap.appendChild(el);
    // Slide in
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('in'); }); });

    // Suara
    startRing(id, data.type);
    // Vibrasi
    if(navigator.vibrate) navigator.vibrate(isAlarm ? [400,150,400,150,400,150,800] : [300,150,300]);

    function dismiss(){
      stopRing(id);
      el.classList.add('out');
      clearTimeout(timers[id]);
      setTimeout(function(){ el.remove(); }, 400);
      // Broadcast dismiss supaya semua tab tahu
      if(ch) ch.postMessage({action:'dismiss', id:id});
    }

    el.querySelector('.orbit-notif-close').addEventListener('click', function(e){
      e.stopPropagation(); dismiss();
    });
    el.addEventListener('click', function(){ window.location.href = CLOCK_PAGE; });

    if(dur) timers[id] = setTimeout(dismiss, dur);

    // Auto re-ring alarm setiap 30 detik jika belum dismiss
    if(isAlarm){
      timers['vib-'+id] = setInterval(function(){
        if(document.getElementById('onotif-'+id)){
          el.classList.remove('alarm');
          void el.offsetWidth;
          el.classList.add('alarm');
          if(navigator.vibrate) navigator.vibrate([400,150,400,150,800]);
        } else { clearInterval(timers['vib-'+id]); }
      }, 30000);
    }
  }

  function escHtml(s){ return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }

  // ── LISTEN BroadcastChannel ──
  if(ch){
    ch.addEventListener('message', function(e){
      var d = e.data;
      if(!d) return;
      if(d.action==='notify') showBanner(d);
      if(d.action==='dismiss'){
        var el=document.getElementById('onotif-'+d.id);
        if(el){ stopRing(d.id); el.classList.add('out'); setTimeout(function(){el.remove();},400); }
      }
    });
  }

  // ── LISTEN Firestore alarm (untuk alarm cross-device) ──
  // Inject Firebase listener jika Firebase tersedia di halaman ini
  // atau via dynamic import
  function listenFirebaseAlarms(){
    import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js').then(function(m){
      var initializeApp = m.initializeApp;
      return import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js').then(function(fs){
        var cfg = {
          apiKey:"AIzaSyCJlPlTfMXYwPuykQhsx-duxM_LfTU68gA",
          authDomain:"abagja-orbit.firebaseapp.com",
          projectId:"abagja-orbit",
          storageBucket:"abagja-orbit.firebasestorage.app",
          messagingSenderId:"554354531256",
          appId:"1:554354531256:web:19d90218bd6dbcb9ed8d4d"
        };
        var app;
        try{ app=initializeApp(cfg,'notif-listener'); }catch(e){ app=m.getApps?m.getApps()[0]:null; }
        if(!app) return;
        var db = fs.getFirestore(app);
        // Listen ke collection 'notif-events' — clock.html akan menulis ke sini saat trigger
        fs.onSnapshot(
          fs.query(fs.collection(db,'notif-events'), fs.orderBy('ts','desc'), fs.limit(1)),
          function(snap){
            snap.docChanges().forEach(function(change){
              if(change.type!=='added') return;
              var d = change.doc.data();
              // Hanya proses event yang fresh (< 10 detik)
              if(Date.now()-d.ts > 10000) return;
              showBanner({id:change.doc.id, type:d.type, title:d.title, sub:d.sub, dur:d.type==='alarm'?0:8000});
            });
          }
        );
      });
    }).catch(function(){});
  }
  listenFirebaseAlarms();

  // Expose global supaya clock.html bisa trigger
  window.orbitNotif = { show: showBanner };
})();
</script>
